name: Supabase keep-alive

# Секој ден прави едно мало читање од базата за Supabase да не го паузира проектот.
# Ги чита јавните податоци од .env.production.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping
        run: |
          set -a; . ./.env.production; set +a
          SUPABASE_URL="$VITE_SUPABASE_URL"; SUPABASE_ANON_KEY="$VITE_SUPABASE_ANON_KEY"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "$SUPABASE_URL/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY"
